[package]
name = "annaumixyz-mining"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy = { version = "0.8", features = ["providers", "signers", "signer-local", "sol-types", "contract", "network", "rpc-types-eth", "reqwest"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
eyre = "0.6"
rpassword = "7"
num_cpus = "1"
rand = "0.8"
dotenvy = "0.15"
ocl = "0.19"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
